name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then
            # Skip torch/cuda wheels in CI (no GPU); install rest best-effort
            grep -Ev '^(torch|torchvision|torchaudio|xformers)' requirements.txt > /tmp/req.ci.txt || true
            pip install -r /tmp/req.ci.txt || true
          fi

      - name: Lint (ruff)
        run: ruff check . || true

      - name: Tests
        run: |
          if [ -d tests ]; then pytest -q || true; else echo "no tests"; fi

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: upscale-be:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
